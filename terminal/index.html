    desk.style.transform = "translate(" + ox + "px," + oy + "px) scale(" + s + ")";
    var W = Math.round(Math.min(600, Math.max(vw > 900 ? 0 : 320, QW * sNear * 13 / 12.5))), H = Math.round(W * QH / QW);
    place(W, H);
  }
  fit();
  addEventListener("resize", function () { var w = innerWidth; if (Math.abs(w - lastW) > 40) { lastW = SW = w; SH = innerHeight; fit(); } else if (innerHeight > SH) { SH = innerHeight; fit(); } });
  /* when the keyboard rises, nothing is cropped: the desk leans so the whole glass stays above it, and settles back after */
  function lift() {
    var vv = window.visualViewport; if (!vv) return;
    var open = SH - vv.height > 120, h = open ? vv.height : 0, t = open ? vv.offsetTop : 0;
    if (h === kbH && t === kbTop) return;
    kbH = h; kbTop = t; root.classList.add("lean"); fit();
    setTimeout(function () { m.scrollTop = m.scrollHeight; }, 60);
    clearTimeout(lift.t); lift.t = setTimeout(function () { root.classList.remove("lean"); }, 400);
  }
  if (window.visualViewport) { visualViewport.addEventListener("scroll", function () { scrollTo(0, 0); lift(); }); visualViewport.addEventListener("resize", lift); }
  inp.addEventListener("blur", function () { setTimeout(lift, 80); });
  /* step back: from the screen to the whole scene again */
  var back = document.getElementById("back");
  back.addEventListener("click", function (e) {
    e.stopPropagation(); if (far) return;
    far = true; try { sessionStorage.removeItem("termSat"); } catch (er) {}
    inp.blur(); kbH = 0; kbTop = 0;
    root.classList.add("glide", "far"); root.classList.remove("sat"); fit();
    setTimeout(function () { root.classList.remove("glide"); }, 1150);
  });
  window.__endGlass = function () { m.scrollTop = m.scrollHeight; };
  if (q.get("from") === "room") window.__exitTo = "/corridor.html";
})();

say("WELCOME.\nYOU MAY BREATHE HERE.\n");
if (who) say("Welcome back, " + who + ".", "dim");
var hint = say("Type LOOK or HELP. Nothing is required.\n", "faint"); hint.id = "hint";
setTimeout(function () { hint.classList.add("on"); }, 3500);
prompt();
load().then(function () {
  var q = new URLSearchParams(location.search), rd = q.get("read"), cd = q.get("cd");
  if (cd) run("CD \\" + cd);
  var cmd = q.get("cmd"); if (cmd && !rd && !cd) run(cmd);
  if (rd) run("READ " + rd);
});
if (!document.documentElement.classList.contains("far")) inp.focus({ preventScroll: true });
})();
</script>
