<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hönk · AION TEKMIRION</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; color: #535353; background: #fbf8f3; }
  main {
    display: grid;
    align-content: center;
    min-height: 100svh;
    width: min(100%, 96rem);
    margin: auto;
    padding: clamp(1.25rem, 5vw, 5rem);
  }
  .images {
    display: grid;
    grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
    align-items: center;
    gap: clamp(.75rem, 1.8vw, 1.75rem);
  }
  img { display: block; width: 100%; height: auto; border-radius: .3rem; }
  .compass {
    mask-image: linear-gradient(to bottom, transparent, black 6%, black 93%, transparent),
                linear-gradient(to right, transparent, black .65%, black 99.35%, transparent);
    mask-composite: intersect;
  }
  a {
    justify-self: center;
    margin-top: clamp(1rem, 3vw, 2.75rem);
    padding: .6rem 1rem;
    color: inherit;
    font: italic 1.05rem/1.4 Georgia, serif;
    text-decoration-color: #aaa;
    text-underline-offset: .3em;
  }
  a:hover { color: #161616; text-decoration-color: currentColor; }
  a:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
  @media (max-width: 44rem) {
    .images { grid-template-columns: 1fr; gap: 1.25rem; }
    .pillows { width: 88%; justify-self: center; }
  }
</style>
</head>
<body>
<main aria-label="Hönk">
  <div class="images">
    <img class="compass" src="compass.webp" width="1536" height="768" alt="The pink Hönk plushie from the front and back, with its compass opening to reveal a miniature fireside room.">
    <img class="pillows" src="pillows.webp" width="1536" height="1024" alt="Hönk asleep under a blanket embroidered with Truth, beside six pillows embroidered with Trust, Respect, Responsibility, Fairness, Caring and Together.">
  </div>
  <a href="app.html">Try the app</a>
</main>
</body>
</html>
